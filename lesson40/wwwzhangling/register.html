<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 张玲</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --paper: #fdfaf6;
  --paper-warm: #f8f2ea;
  --paper-deep: #f2eadf;
  --ink-soft: #4a4038;
  --ink-light: #7a6f63;
  --ink-muted: #a89a8c;
  --pencil-rose: #e8a5b0;
  --pencil-peach: #f0b8a0;
  --pencil-lilac: #c4a8d4;
  --pencil-sage: #a8c8b8;
  --pencil-sky: #a8c4dc;
  --pencil-butter: #f0d89c;
  --line: #d8cdc0;
  --line-light: #e8dfd3;
  --success: #8fbf8f;
}

body {
  font-family: 'Cormorant Garamond', 'Georgia', 'Songti SC', 'STSong', 'PingFang SC', 'Microsoft YaHei', serif;
  background: var(--paper);
  color: var(--ink-soft);
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
  line-height: 1.7;
}

/* ============ 纸张背景 ============ */
.paper-bg { position: fixed; inset: 0; z-index: 0; background: var(--paper); }
.paper-bg::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(200, 180, 160, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(180, 160, 200, 0.05) 0%, transparent 40%);
}
.paper-bg::after {
  content: '';
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    0deg,
    rgba(160, 140, 120, 0.015) 0px,
    rgba(160, 140, 120, 0.015) 1px,
    transparent 1px,
    transparent 3px
  );
  opacity: 0.6;
}
.paper-vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 40%, rgba(180, 160, 140, 0.12) 100%);
}

/* ============ 角落花卉 ============ */
.floral-corner { position: fixed; z-index: 2; pointer-events: none; opacity: 0.9; }
.floral-tl { top: -30px; left: -30px; width: 240px; height: 240px; }
.floral-br { bottom: -40px; right: -30px; width: 280px; height: 280px; transform: rotate(180deg); }

/* ============ 页面结构 ============ */
.page {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
}

/* ============ 左侧：欢迎语 ============ */
.welcome-side {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 3rem 4rem;
  position: relative;
}

.welcome-logo {
  display: flex;
  align-items: center;
  gap: 0.9rem;
  text-decoration: none;
  color: var(--ink-soft);
}
.logo-flower { width: 42px; height: 42px; flex-shrink: 0; }
.logo-text { display: flex; flex-direction: column; line-height: 1.15; }
.logo-text .main {
  font-size: 1.3rem; font-weight: 500; letter-spacing: 6px;
  color: var(--ink-soft);
}
.logo-text .sub {
  font-size: 0.58rem; letter-spacing: 3px;
  color: var(--ink-muted); margin-top: 2px;
  text-transform: uppercase;
  font-family: 'Helvetica Neue', sans-serif;
  font-weight: 300;
}

.welcome-content {
  max-width: 380px;
  animation: fadeUp 1.2s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.welcome-content .line-deco {
  width: 40px; height: 1px;
  background: var(--pencil-lilac);
  margin-bottom: 1.6rem;
}

.welcome-content h2 {
  font-size: 2.4rem;
  font-weight: 500;
  letter-spacing: 3px;
  line-height: 1.3;
  color: var(--ink-soft);
  margin-bottom: 1.2rem;
  font-family: 'Cormorant Garamond', 'Songti SC', serif;
}
.welcome-content h2 .accent {
  color: var(--pencil-lilac);
  font-style: italic;
}

.welcome-content p {
  font-size: 0.95rem;
  line-height: 2;
  color: var(--ink-light);
  font-family: 'Songti SC', 'STSong', 'PingFang SC', serif;
  letter-spacing: 0.5px;
}

/* 优势列表 */
.welcome-list {
  margin-top: 2rem;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}
.welcome-list-item {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  font-size: 0.88rem;
  color: var(--ink-light);
  font-family: 'Songti SC', 'STSong', serif;
}
.welcome-list-item .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--pencil-lilac);
  flex-shrink: 0;
  box-shadow: 0 0 0 3px rgba(196, 168, 212, 0.2);
}

.welcome-footer {
  font-size: 0.72rem;
  letter-spacing: 2px;
  color: var(--ink-muted);
  font-family: 'Helvetica Neue', sans-serif;
  font-weight: 300;
}

.welcome-decoration {
  position: absolute;
  top: 50%; left: 55%;
  transform: translate(-50%, -50%);
  width: 220px;
  opacity: 0.35;
  pointer-events: none;
}

/* ============ 右侧：注册表单 ============ */
.form-side {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 4rem;
  background: linear-gradient(135deg, transparent 0%, rgba(242, 234, 223, 0.3) 100%);
  border-left: 1px solid var(--line-light);
  position: relative;
}
.form-side::before {
  content: '';
  position: absolute;
  top: 50%; left: 0;
  transform: translateY(-50%);
  height: 120px;
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--pencil-lilac), transparent);
}

.auth-card {
  width: 100%;
  max-width: 400px;
  animation: fadeUp 1.2s ease 0.15s both;
}

.auth-header {
  margin-bottom: 2rem;
  text-align: center;
}
.auth-header h1 {
  font-size: 2rem;
  font-weight: 500;
  letter-spacing: 6px;
  color: var(--ink-soft);
  margin-bottom: 0.6rem;
  font-family: 'Cormorant Garamond', 'Songti SC', serif;
  position: relative;
  display: inline-block;
}
.auth-header h1::after {
  content: '';
  position: absolute;
  bottom: 6px; left: -6px; right: -6px;
  height: 10px;
  background: rgba(196, 168, 212, 0.35);
  z-index: -1;
  border-radius: 6px;
}
.auth-header .en {
  display: block;
  font-size: 0.7rem;
  letter-spacing: 5px;
  color: var(--ink-muted);
  text-transform: uppercase;
  font-family: 'Helvetica Neue', sans-serif;
  font-weight: 300;
  margin-top: 0.8rem;
}

.auth-form {
  display: flex;
  flex-direction: column;
  gap: 1.15rem;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.form-label {
  font-size: 0.72rem;
  letter-spacing: 3px;
  color: var(--ink-muted);
  text-transform: uppercase;
  font-family: 'Helvetica Neue', sans-serif;
  font-weight: 300;
  padding-left: 4px;
  transition: color 0.3s;
}
.form-group:focus-within .form-label {
  color: var(--pencil-lilac);
}

.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.input-icon {
  position: absolute;
  left: 16px;
  width: 18px; height: 18px;
  opacity: 0.5;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 2;
}
.form-group:focus-within .input-icon { opacity: 1; }

.input-field {
  width: 100%;
  padding: 0.8rem 1rem 0.8rem 3rem;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid var(--line);
  border-radius: 2px;
  color: var(--ink-soft);
  font-size: 0.9rem;
  font-family: 'Songti SC', 'STSong', 'PingFang SC', serif;
  letter-spacing: 1px;
  outline: none;
  transition: all 0.35s;
  backdrop-filter: blur(4px);
}
.input-field::placeholder {
  color: var(--ink-muted);
  letter-spacing: 1.5px;
  opacity: 0.7;
}
.input-field:hover {
  border-color: var(--line);
  background: rgba(255, 255, 255, 0.7);
}
.input-field:focus {
  border-color: var(--pencil-lilac);
  background: rgba(255, 255, 255, 0.85);
  box-shadow:
    0 0 0 3px rgba(196, 168, 212, 0.12),
    0 4px 12px rgba(180, 140, 150, 0.08);
}

.toggle-pwd {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px; height: 20px;
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.3s;
  z-index: 2;
}
.toggle-pwd:hover { opacity: 1; }
.toggle-pwd::before {
  content: '';
  position: absolute;
  inset: 3px 0;
  border-radius: 50% 50% 45% 45%;
  border: 1.5px solid var(--ink-light);
}
.toggle-pwd::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--ink-light);
}

/* 密码强度 */
.pwd-strength {
  display: flex;
  gap: 4px;
  margin-top: 4px;
  height: 2px;
  padding: 0 4px;
}
.strength-bar {
  flex: 1;
  background: var(--line-light);
  border-radius: 2px;
  transition: background 0.3s;
}
.strength-bar.weak { background: var(--pencil-peach); }
.strength-bar.medium { background: var(--pencil-butter); }
.strength-bar.strong { background: var(--success); }

/* 协议 */
.agreement {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  font-size: 0.78rem;
  color: var(--ink-light);
  line-height: 1.7;
  cursor: pointer;
  user-select: none;
  font-family: 'Songti SC', 'STSong', serif;
  letter-spacing: 0.5px;
}
.agreement:hover { color: var(--ink-soft); }
.agreement .checkbox-custom { margin-top: 3px; }
.agreement a {
  color: var(--pencil-rose);
  text-decoration: none;
  transition: color 0.3s;
  border-bottom: 1px dotted var(--pencil-rose);
}
.agreement a:hover { color: var(--pencil-lilac); border-bottom-color: var(--pencil-lilac); }

.checkbox-wrap { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; }
.checkbox-custom {
  width: 15px; height: 15px;
  border: 1px solid var(--line);
  border-radius: 2px;
  position: relative;
  transition: all 0.3s;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.5);
}
.checkbox-wrap input[type="checkbox"],
.agreement input[type="checkbox"] { display: none; }
.checkbox-wrap input[type="checkbox"]:checked + .checkbox-custom,
.agreement input[type="checkbox"]:checked + .checkbox-custom {
  background: var(--pencil-lilac);
  border-color: var(--pencil-lilac);
}
.checkbox-wrap input[type="checkbox"]:checked + .checkbox-custom::after,
.agreement input[type="checkbox"]:checked + .checkbox-custom::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border-right: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(45deg);
}

.btn-submit {
  margin-top: 0.4rem;
  padding: 1rem;
  width: 100%;
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 6px;
  font-family: 'Cormorant Garamond', 'Songti SC', serif;
  color: var(--paper);
  background: var(--ink-soft);
  border: 1px solid var(--ink-soft);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.35s;
  box-shadow: 0 4px 16px rgba(74, 64, 56, 0.15);
  position: relative;
  overflow: hidden;
}
.btn-submit::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.6s;
}
.btn-submit:hover::after { left: 100%; }
.btn-submit:hover {
  background: var(--pencil-lilac);
  border-color: var(--pencil-lilac);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(196, 168, 212, 0.4);
}
.btn-submit:active { transform: translateY(0); }

.auth-switch {
  text-align: center;
  margin-top: 1.8rem;
  font-size: 0.85rem;
  color: var(--ink-light);
  letter-spacing: 1px;
  font-family: 'Songti SC', 'STSong', serif;
}
.auth-switch a {
  color: var(--pencil-lilac);
  text-decoration: none;
  font-weight: 500;
  margin-left: 0.3rem;
  transition: all 0.3s;
  border-bottom: 1px dotted var(--pencil-lilac);
  padding-bottom: 1px;
}
.auth-switch a:hover {
  color: var(--pencil-rose);
  border-bottom-color: var(--pencil-rose);
}

/* ============ 响应式 ============ */
@media (max-width: 900px) {
  body { overflow-y: auto; }
  .page { grid-template-columns: 1fr; }
  .welcome-side {
    padding: 2rem 2rem 1rem;
    min-height: auto;
  }
  .welcome-content { max-width: 100%; }
  .welcome-content h2 { font-size: 1.8rem; }
  .welcome-decoration { display: none; }
  .welcome-footer { display: none; }
  .form-side {
    padding: 1rem 2rem 3rem;
    border-left: none;
    background: none;
  }
  .form-side::before { display: none; }
}

@media (max-width: 480px) {
  .welcome-side { padding: 1.5rem 1.5rem 1rem; }
  .form-side { padding: 1rem 1.5rem 2.5rem; }
  .auth-header h1 { font-size: 1.6rem; letter-spacing: 4px; }
  .floral-tl { width: 160px; height: 160px; }
  .floral-br { width: 180px; height: 180px; }
}
</style>
</head>

              <circle cx="9" cy="11.5" r="1" fill="#a89a8c"/>
            </svg>
            <input type="password" class="input-field" id="pwd" placeholder="至少 8 位，字母与数字" required oninput="checkStrength(this.value)">
            <div class="toggle-pwd" onclick="togglePwd(this)"></div>
          </div>
          <div class="pwd-strength" id="strength">
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">确认密码</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="8" width="10" height="7" rx="1" fill="none" stroke="#a89a8c" stroke-width="1.2"/>
              <path d="M6 8 V6 a3 3 0 0 1 6 0 V8" fill="none" stroke="#a89a8c" stroke-width="1.2"/>
              <circle cx="9" cy="11.5" r="1" fill="#a89a8c"/>
            </svg>
            <input type="password" class="input-field" placeholder="再输入一次" required>
            <div class="toggle-pwd" onclick="togglePwd(this)"></div>
          </div>
        </div>

        <label class="agreement">
          <input type="checkbox" required>
          <span class="checkbox-custom"></span>
          <span>我已阅读并同意 <a href="#">《服务条款》</a> 与 <a href="#">《隐私政策》</a></span>
        </label>

        <button type="submit" class="btn-submit">创 建 账 号</button>

      </form>

      <div class="auth-switch">
        已有账号？<a href="login.html">前往登录</a>
        <a href="index.html">返回首页</a>
      </div>

    </div>
  </div>

</div>

<script>
function togglePwd(el) {
  const input = el.parentElement.querySelector('.input-field');
  input.type = input.type === 'password' ? 'text' : 'password';
  el.style.opacity = input.type === 'text' ? '1' : '0.5';
}

function checkStrength(val) {
  const bars = document.querySelectorAll('#strength .strength-bar');
  let score = 0;
  if (val.length >= 8) score++;
  if (/[a-zA-Z]/.test(val) && /[0-9]/.test(val)) score++;
  if (/[^a-zA-Z0-9]/.test(val)) score++;
  if (val.length >= 12) score++;

  bars.forEach(b => b.className = 'strength-bar');
  for (let i = 0; i < score; i++) {
    if (score <= 1) bars[i].classList.add('weak');
    else if (score <= 3) bars[i].classList.add('medium');
    else bars[i].classList.add('strong');
  }
}
</script>

</body>
</html>
