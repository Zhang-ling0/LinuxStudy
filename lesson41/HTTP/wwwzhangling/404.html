<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面未找到 · 张玲</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --paper: #fdfaf6;
  --paper-warm: #f8f2ea;
  --paper-deep: #f2eadf;
  --ink-soft: #4a4038;
  --ink-light: #7a6f63;
  --ink-muted: #a89a8c;
  --pencil-rose: #e8a5b0;
  --pencil-peach: #f0b8a0;
  --pencil-lilac: #c4a8d4;
  --pencil-sage: #a8c8b8;
  --pencil-sky: #a8c4dc;
  --pencil-butter: #f0d89c;
  --line: #d8cdc0;
  --line-light: #e8dfd3;
}

body {
  font-family: 'Cormorant Garamond', 'Georgia', 'Songti SC', 'STSong', 'PingFang SC', 'Microsoft YaHei', serif;
  background: var(--paper);
  color: var(--ink-soft);
  overflow: hidden;
  min-height: 100vh;
  position: relative;
  line-height: 1.7;
}

/* ============ 纸张背景 ============ */
.paper-bg {
  position: fixed; inset: 0; z-index: 0;
  background: var(--paper);
}
.paper-bg::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(200, 180, 160, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(180, 160, 200, 0.05) 0%, transparent 40%);
}
.paper-bg::after {
  content: '';
  position: absolute; inset: 0;
  background-image: repeating-linear-gradient(
    0deg,
    rgba(160, 140, 120, 0.015) 0px,
    rgba(160, 140, 120, 0.015) 1px,
    transparent 1px,
    transparent 3px
  );
  opacity: 0.6;
}
.paper-vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 90% 80% at 50% 50%, transparent 40%, rgba(180, 160, 140, 0.12) 100%);
}

/* ============ 角落花卉 ============ */
.floral-corner {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  opacity: 0.9;
}
.floral-tl { top: -30px; left: -30px; width: 280px; height: 280px; }
.floral-br { bottom: -40px; right: -30px; width: 320px; height: 320px; transform: rotate(180deg); }

/* ============ 404 主容器 ============ */
.error-page {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
}

/* 顶部 Logo */
.error-logo {
  position: absolute;
  top: 2.4rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 0.9rem;
  text-decoration: none;
  color: var(--ink-soft);
  animation: fadeDown 1s ease both;
}
@keyframes fadeDown {
  from { opacity: 0; transform: translate(-50%, -20px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}
.logo-flower {
  width: 40px; height: 40px;
  flex-shrink: 0;
}
.logo-text {
  display: flex; flex-direction: column; line-height: 1.15;
  text-align: left;
}
.logo-text .main {
  font-size: 1.25rem;
  font-weight: 500;
  letter-spacing: 6px;
  color: var(--ink-soft);
}
.logo-text .sub {
  font-size: 0.58rem;
  letter-spacing: 3px;
  color: var(--ink-muted);
  margin-top: 2px;
  text-transform: uppercase;
  font-family: 'Helvetica Neue', sans-serif;
  font-weight: 300;
}

/* ============ 中央内容 ============ */
.error-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeUp 1.2s ease 0.2s both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 404 数字区 */
.error-code {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 2rem;
}

.error-digit {
  font-size: 8rem;
  font-weight: 500;
  line-height: 1;
  color: var(--ink-soft);
  font-family: 'Cormorant Garamond', 'Georgia', serif;
  letter-spacing: -4px;
  position: relative;
}
.error-digit::after {
  content: '';
  position: absolute;
  bottom: 10px; left: 0; right: 0;
  height: 12px;
  background: rgba(232, 165, 176, 0.35);
  z-index: -1;
  border-radius: 6px;
}

/* 中间的零：彩铅小花朵 */
.zero-flower {
  width: 130px;
  height: 130px;
  position: relative;
  flex-shrink: 0;
}
.zero-flower svg {
  width: 100%; height: 100%;
  animation: slowSpin 60s linear infinite;
}
@keyframes slowSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* 文字 */
.error-title {
  font-size: 1.8rem;
  font-weight: 500;
  letter-spacing: 6px;
  color: var(--ink-soft);
  margin-bottom: 0.8rem;
  font-family: 'Cormorant Garamond', 'Songti SC', serif;
}

.error-subtitle {
  font-size: 0.85rem;
  letter-spacing: 5px;
  color: var(--ink-muted);
  margin-bottom: 1.6rem;
  font-family: 'Helvetica Neue', sans-serif;
  font-weight: 300;
  text-transform: uppercase;
}

.error-divider {
  width: 60px;
  height: 1px;
  background: var(--pencil-rose);
  margin: 0 auto 1.8rem;
  position: relative;
}
.error-divider::before,
.error-divider::after {
  content: '';
  position: absolute;
  top: -3px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--pencil-rose);
  opacity: 0.6;
}
.error-divider::before { left: -12px; }
.error-divider::after { right: -12px; }

.error-desc {
  font-size: 0.95rem;
  line-height: 2;
  color: var(--ink-light);
  max-width: 460px;
  margin: 0 auto 2.6rem;
  letter-spacing: 0.5px;
  font-family: 'Songti SC', 'STSong', 'PingFang SC', serif;
}
.error-desc .hl {
  color: var(--ink-soft);
  border-bottom: 1px dotted var(--pencil-rose);
  padding-bottom: 1px;
}

/* 按钮组 */
.error-buttons {
  display: flex;
  gap: 1.2rem;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.9rem 2.2rem;
  font-size: 0.85rem;
  letter-spacing: 3px;
  font-family: 'Cormorant Garamond', 'Songti SC', serif;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.35s;
  border-radius: 2px;
}
.btn-primary {
  background: var(--ink-soft);
  color: var(--paper);
  border: 1px solid var(--ink-soft);
  box-shadow: 0 4px 16px rgba(74, 64, 56, 0.15);
}
.btn-primary:hover {
  background: var(--pencil-rose);
  border-color: var(--pencil-rose);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(232, 165, 176, 0.4);
}
.btn-primary::after {
  content: '→';
  font-family: 'Helvetica Neue', sans-serif;
  transition: transform 0.3s;
}
.btn-primary:hover::after { transform: translateX(4px); }

.btn-ghost {
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
}
.btn-ghost:hover {
  border-color: var(--pencil-lilac);
  color: var(--pencil-lilac);
  background: rgba(196, 168, 212, 0.06);
  transform: translateY(-2px);
}

/* 底部状态 */
.error-footer {
  position: absolute;
  bottom: 2rem;
  left: 0; right: 0;
  text-align: center;
  font-size: 0.72rem;
  letter-spacing: 3px;
  color: var(--ink-muted);
  font-family: 'Helvetica Neue', sans-serif;
  font-weight: 300;
  animation: fadeUp 1.2s ease 0.6s both;
}
.error-footer::before {
  content: '';
  display: block;
  width: 40px;
  height: 1px;
  background: var(--line);
  margin: 0 auto 0.8rem;
}

/* ============ 响应式 ============ */
@media (max-width: 640px) {
  .error-digit { font-size: 5rem; }
  .zero-flower { width: 90px; height: 90px; }
  .error-code { gap: 0.6rem; }
  .error-title { font-size: 1.3rem; letter-spacing: 4px; }
  .error-subtitle { font-size: 0.72rem; letter-spacing: 3px; }
  .error-desc { font-size: 0.88rem; padding: 0 1rem; }
  .error-buttons { flex-direction: column; align-items: stretch; padding: 0 1.5rem; }
  .btn { justify-content: center; }
  .floral-tl { width: 180px; height: 180px; }
  .floral-br { width: 200px; height: 200px; }
  .error-logo { top: 1.4rem; }
  .logo-text .main { font-size: 1rem; letter-spacing: 4px; }
  .logo-text .sub { display: none; }
}
</style>
</head>
